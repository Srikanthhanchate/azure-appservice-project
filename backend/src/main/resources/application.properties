spring.application.name=orginsight-backend

# ===============================
# DATABASE
# ===============================
# spring.datasource.url=jdbc:mysql://localhost:3306/orginsight_db
# spring.datasource.username=root
# spring.datasource.password=rootpass
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.url=${AZURE_SQL_CONNECTION_STRING}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
upload.dir=uploads

# ===============================
# JWT
# ===============================
# jwt.secret=change-this-jwt-secret-for-production
jwt.secret=${JWT_SECRET}

# ===============================
# AI (Google Gemini)
# ===============================
# Set your Gemini API key using an environment variable or your local
# application.properties file. Leave this blank before pushing to GitHub.
gemini.api-key=

gemini.model=gemini-2.5-flash
gemini.enabled=false
gemini.cache-minutes=60

# ===============================
# LOGGING
# ===============================
logging.level.com.orginsight.ai=INFO
logging.level.com.orginsight.service.impl.AiInsightsServiceImpl=INFO
logging.level.com.orginsight.service.impl.AiCopilotServiceImpl=INFO
logging.level.com.orginsight.controller.AiInsightsController=INFO

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true