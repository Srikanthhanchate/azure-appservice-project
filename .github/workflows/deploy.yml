name: Build and Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  JAVA_VERSION: '21'
  TERRAFORM_VERSION: '1.9.8'

jobs:

  # ============================================================
  # Stage 1: Build Java Application
  # ============================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build with Maven
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar


  # ============================================================
  # Stage 2: Deploy Terraform Infrastructure
  # ============================================================
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: build

    outputs:
      app_service_name: ${{ steps.terraform_output.outputs.app_service_name }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------
      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange      
      - name: Verify Azure Identity
        env:
          EXPECTED_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          echo "Azure account:"
          az account show \
            --query "{subscription:id,tenant:tenantId,user:user.name,userType:user.type}" \
            -o table

          echo ""
          echo "Checking logged-in identity..."

          ACTUAL_CLIENT_ID=$(az account show --query "user.name" -o tsv)

          if [ "$ACTUAL_CLIENT_ID" != "$EXPECTED_CLIENT_ID" ]; then
            echo "ERROR: GitHub Actions logged into a different Azure identity."
            exit 1
          fi

          echo "SUCCESS: Correct Azure client ID is being used."

      - name: Test Storage Access
        run: |
          az storage blob list \
            --account-name stwebapptfstate20260830 \
            --container-name tfstate \
            --auth-mode login \
            -o table

      


      # --------------------------------------------------------
      # TEMPORARY: Test Terraform State Storage Access
      # --------------------------------------------------------
      - name: Test Storage Access
        run: |
          az storage blob list \
            --account-name stwebapptfstate20260830 \
            --container-name tfstate \
            --auth-mode login \
            -o table


      # --------------------------------------------------------
      # Setup Terraform
      # --------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}


      # --------------------------------------------------------
      # Terraform Init
      # --------------------------------------------------------
      - name: Terraform Init
        working-directory: terraform
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_SKIP_PROVIDER_REGISTRATION: true
        run: terraform init


      # --------------------------------------------------------
      # Terraform Validate
      # --------------------------------------------------------
      - name: Terraform Validate
        working-directory: terraform
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_SKIP_PROVIDER_REGISTRATION: true
        run: terraform validate


      # --------------------------------------------------------
      # Terraform Plan
      # --------------------------------------------------------
      - name: Terraform Plan
        working-directory: terraform
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_SKIP_PROVIDER_REGISTRATION: true
        run: terraform plan


      # --------------------------------------------------------
      # Terraform Apply
      # --------------------------------------------------------
      - name: Terraform Apply
        working-directory: terraform
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_SKIP_PROVIDER_REGISTRATION: true
        run: terraform apply -auto-approve


      # --------------------------------------------------------
      # Get Terraform Outputs
      # --------------------------------------------------------
      - name: Get Terraform Outputs
        id: terraform_output
        working-directory: terraform
        env:
          ARM_USE_OIDC: true
          ARM_USE_AZUREAD: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          echo "app_service_name=$(terraform output -raw app_service_name)" >> "$GITHUB_OUTPUT"


  # ============================================================
  # Stage 3: Deploy Java Application
  # ============================================================
  deploy-app:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: deploy-infra

    steps:

      # --------------------------------------------------------
      # Download JAR from Build Job
      # --------------------------------------------------------
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: app


      # --------------------------------------------------------
      # Azure OIDC Login
      # --------------------------------------------------------
      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange


      # --------------------------------------------------------
      # Deploy JAR to Azure App Service
      # --------------------------------------------------------
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.deploy-infra.outputs.app_service_name }}
          package: app/*.jar